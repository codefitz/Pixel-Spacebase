mines.mine.name=mine
mines.mine.desc=A concealed mine waits for pressure or movement.

mines.aliendevice.name=Hunter Mine
mines.aliendevice.desc=A proximity mine tuned for alien movement signatures.\n\nOnce triggered it also emits a short hunter-band signal so nearby enemies know something has been caught.\n\nIt might be possible to dismantle it into something useful.
mines.aliendevice$device.name=Hunter Mine Charge

mines.firemine.name=Fire Mine
mines.firemine.desc=When something crosses the mine, it bursts into flames.
mines.firemine$device.name=Fire Mine Charge
mines.adrenalboost.name=Adrenal Mine
mines.adrenalboost.desc=A rare combat stimulant mine. Triggering it temporarily increases accuracy and evasion.
mines.adrenalboost$device.name=Adrenal Stimulant
mines.adrenalboost$device.desc=A single-use combat stimulant. Using it temporarily increases accuracy and evasion.
mines.flashmine.name=Flash Mine
mines.flashmine.desc=Upon being triggered, the mine emits a blinding flash strong enough to disorient for several seconds.
mines.flashmine$device.name=Flash Mine Charge
mines.koltopod.name=Medigel Mine
mines.koltopod.desc=Stepping onto this mine projects a temporary medical field that restores health while the field holds.
mines.koltopod$device.name=Medigel Stimulant
mines.koltopod$device.desc=A single-use medical stimulant. Using it projects a temporary medical field that restores health while the field holds.
mines.koltopod$health.name=Healing Shield
mines.koltopod$health.desc=The medigel mine provides a temporary forcefield that restores health, though it is not as fast as other alien technology.\n\nYou are currently slowly regenerating health from the medigel mine. Taking damage while healing will reduce the healing effectiveness, and moving off the mine will cause the forcefield to collapse.\n\nHealing remaining: %d.

mines.icemine.name=Ice Mine
mines.icemine.desc=Upon being triggered, the mine will freeze the trespasser. The freezing effect is much stronger if the environment is damp.
mines.icemine$device.name=Cryo Mine Charge
mines.disorientationmine.name=Disorientation Mine
mines.disorientationmine.desc=The mine will cause anything triggering it to become confused and disoriented.
mines.disorientationmine$device.name=Vertigo Mine Charge
mines.venommine.name=Venom Mine
mines.venommine.desc=A venom mine will dose the victim with deadly venom.
mines.venommine$device.name=Venom Mine Charge
mines.knockoutmine.name=Knockout Mine
mines.knockoutmine.refreshed=You feel refreshed.
mines.knockoutmine.desc=The mine contains a strong neutralizing agent. Most weaker aliens are overwhelmed and knocked unconscious.
mines.knockoutmine$device.name=Knockout Mine Charge
mines.weakforcefield.name=Forcefield Mine
mines.weakforcefield.desc=When a humanoid triggers this mine, a temporary weak forcefield is generated around them.
mines.weakforcefield$device.name=Forcefield Stimulant
mines.weakforcefield$device.desc=A single-use defensive stimulant. Using it generates a temporary weak forcefield around you.
mines.weakforcefield$armor.name=Weak Forcefield
mines.weakforcefield$armor.desc=A temporary weak forcefield is protecting you.\n\nThis forcefield will absorb 50%% of all physical damage you take until it eventually runs out of durability and collapses. The forcefield is also immobile; if you attempt to move, it will collapse.\n\nForcefield remaining: %d.
mines.teleportationpod.name=Phase Mine
mines.teleportationpod.desc=This mine teleports any humanoid to a random place on the current floor.
mines.teleportationpod$device.name=Phase Mine Charge
mines.alienegg.name=Xenomorph Egg
mines.alienegg.desc=A strange alien egg placed here on Pixel Spacebase. The shell pulses faintly, as if something inside is waiting for pressure.
mines.alienegg$device.name=Alien Egg

mines.mine$device.device=%s mine charge
mines.mine$device.ac_set=ARM
mines.mine$device.info=%2$s\n\nThis %3$s can be armed to create a %1$s.
mines.mine$stimulantdevice.ac_use=USE
mines.mine$stimulantdevice.info=%2$s\n\nThis stimulant can be used immediately.
