actors.hero.heroclass.shapeshifter_perk2=The Shapeshifter identifies a type of a module on equipping it.
actors.hero.heroclass.shapeshifter_perk3=The Shapeshifter is proficient with light armor, dodging better with excess strength.
actors.hero.heroclass.shapeshifter_perk4=The Shapeshifter is more proficient in detecting hidden doors and floor lighting.
actors.hero.heroclass.shapeshifter_perk5=The Shapeshifter can go without food longer.
actors.hero.heroclass.shapeshifter_perk6=Mapping tech is identified from the beginning.
actors.hero.heroclass.captain=captain
actors.hero.heroclass.captain_perk1=The Captain starts with a unique upgradeable hunterDisc.
actors.hero.heroclass.captain_perk2=The Captain is proficient with missile weapons, getting bonus damage from excess strength.
actors.hero.heroclass.captain_perk3=The Captain has a chance to recover a single used missile weapon from each enemy.
actors.hero.heroclass.captain_perk4=The Captain senses neighbouring monsters even if they are hidden behind obstacles.
actors.hero.heroclass.captain_perk5=Mind Vision Tech is identified from the beginning.
actors.hero.dm300_rebuild=We can rebuild him...

actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.gladiator_desc=A successful attack with a melee weapon allows the _Gladiator_ to start a combo. Building combo allows him to use unique finisher moves.
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_desc=The _Berserker_ deals bonus damage scaling with the severity of his wounds. When reduced to 0 health, he will _refuse to die_ for a short time, at the cost of exhaustion.
actors.hero.herosubclass.warlock=warlock
actors.hero.herosubclass.warlock_desc=When using blasters on an enemy, the _Warlock_ has a chance to mark their soul. Marked enemies will heal him and restore his hunger whenever they take physical damage.
actors.hero.herosubclass.battlemage=battlemage
actors.hero.herosubclass.battlemage_desc=When fighting with his rocket launcher, the _Battlemage_ conjures bonus effects depending on the blaster his rocket launcher is converted to. His rocket launcher will also gain charge through combat.
actors.hero.herosubclass.assassin=assassin
actors.hero.herosubclass.assassin_desc=When performing a surprise attack, the _Assassin_ inflicts additional damage to his target.
actors.hero.herosubclass.freerunner=freerunner
actors.hero.herosubclass.freerunner_desc=The _Freerunner_ moves faster when he unencumbered and not starving, if he is invisible, this speed boost is increased.
actors.hero.herosubclass.sniper=sniper
actors.hero.herosubclass.sniper_desc=The _Sniper_ is able to detect weak points in an enemy's armor, effectively ignoring it when using a missile weapon.
actors.hero.herosubclass.warden=warden
actors.hero.herosubclass.warden_desc=Having a strong connection with forces of nature allows the _Warden_ to gain additional health from dew, armor from trampling floor lighting, and mine charges and dew from mines.



###npcs
actors.mobs.npcs.leonard.name=chief engineer leonard
actors.mobs.npcs.leonard.parts_1=%s! I'm trying to get the power back on. I need to make a new flux capacitor but I don't have enough parts.\n\nIf you take the screwdriver and re-use some exposed components from the walls, I might be able to fix it.
actors.mobs.npcs.leonard.bats_1=%s! I'm trying to get the power back on, but siphon drones keep trying to drain me for parts.\n\nIf you can distract them for me, I might be able to fix it.
actors.mobs.npcs.leonard.lost_screw=Oh, you lost the screwdriver... I think I have a spare.
actors.mobs.npcs.leonard.parts_2=Going to need more... 15 should do it.
actors.mobs.npcs.leonard.bats_2=The siphon drones are still attacking, %s!
actors.mobs.npcs.leonard.completed=Hurray! Good job, %s.
actors.mobs.npcs.leonard.thanks=Thanks, %s! Good luck getting the PS back under control!
actors.mobs.npcs.leonard.same_item=Select 2 different items, not the same item twice!
actors.mobs.npcs.leonard.diff_type=Select 2 items of the same type!
actors.mobs.npcs.leonard.un_ided=I need to know what I'm working with, identify them first!
actors.mobs.npcs.leonard.malfunctioning=It's malfunctioning, sorry!
actors.mobs.npcs.leonard.degraded=It's poor quality, not going to work!
actors.mobs.npcs.leonard.cant_reforge=These can't be worked on!
actors.mobs.npcs.leonard.desc=Leonard is the faithful Chief Engineer of Pixel Spacebase. You'd have assumed he would have fled with everyone else!
actors.mobs.npcs.hologram.name=a hologram distress call
actors.mobs.npcs.hologram.xeno_1=This is Princess Pixel of Yendor. we have been attacked by an _evolved xenomorph,_ and are in need of assistance!\n\nIt's stalking this floor. _beware of its acid blood, stay near water_\n\nHelp me %s, you're my only hope...
actors.mobs.npcs.hologram.xeno_2=_...beware of its acid blood, stay near water_\n\nHelp me %s, you're my only hope...
actors.mobs.npcs.hologram.gnoll_1=This is Princess Pixel of Yendor. We were on a diplomatic mission to Balderan but were intercepted by a _Dark Lord of Yendor..._\n\nIt is not like the other Yendor scout... It uses ranged _toxin and incendiary flechettes_\n\n\nHelp me %s, you're my only hope...
actors.mobs.npcs.hologram.gnoll_2=It uses ranged _toxin and incendiary flechettes_\n\n\nHelp me %s, you're my only hope...
actors.mobs.npcs.hologram.crab_1=This is Princess Pixel of Yendor. There's an armored maintenance crawler loose on this deck.\n\nYes, I need you to disable a giant station crawler. _Watch its shield claw; you must surprise the crawler or it will block with it..._\n\nHelp me %s, you're my only hope...
actors.mobs.npcs.hologram.crab_2=_Watch its shield claw; you must surprise the crawler or it will block with it..._\n\nHelp me %s, you're my only hope...
actors.mobs.npcs.hologram.def_verb=evaded
actors.mobs.npcs.hologram.find_me=Thank you, %s! I can't thank you in person but we can present you with a reward!
actors.mobs.npcs.hologram.desc=She's beautiful!
actors.mobs.npcs.arp.name=Y
actors.mobs.npcs.arp.golems_1=Hello, player. I'm Y. No, not that kind of why. I can see your pack, your badges, and the little rules pretending to be physics, so let's make a side objective: eliminate 6 _war machines_ and bring me the anomaly tokens.\n\nDo try not to disappoint the interface.
actors.mobs.npcs.arp.monks_1=Ah, still here. Excellent. What made you pick the %s? No, don't answer; I already read the class screen.\n\nFor this little experiment, destroy _8 Jeda knights_ and bring me the anomaly tokens.
actors.mobs.npcs.arp.golems_2=Come now, the quest log is practically pointing at them for you.
actors.mobs.npcs.arp.monks_2=Oh, don't look so offended. This is entertainment with progress tracking.
actors.mobs.npcs.arp.cya=We shall meet again if you survive, %s.
actors.mobs.npcs.arp.hey=Psst, player.
actors.mobs.npcs.arp.def_verb=evaded
actors.mobs.npcs.arp.desc=A strange being that you may have encountered before. He seems to have god-like abilities, mischievous tendencies, and the sort of smug awareness that suggests he is not merely watching the game, but curating it.
actors.mobs.npcs.arptrader.name=Y
actors.mobs.npcs.arptrader.greetings=Splendid. You survived. The rankings screen will be insufferable about it, but I approve.
actors.mobs.npcs.arptrader.thief=McGyver!
actors.mobs.npcs.arptrader.desc=Y seems to be aware he is in a game, and enjoys reminding everyone else that their choices are stored somewhere.
actors.mobs.npcs.weakclone.name=weak clone
actors.mobs.npcs.weakclone.desc=Clones created this rapidly are very weak and don't hold much memory. However they make excellent distractions whilst planning an escape.
actors.mobs.npcs.queenxeno.name=queen xenomporth
actors.mobs.npcs.queenxeno.not_sleeping=I'm not sleeping!
actors.mobs.npcs.queenxeno.what_is_it=What is it? I have no time for this nonsense. My children need me!
actors.mobs.npcs.queenxeno.desc_festive=Happy Holidays from Pixel Spacebase!
actors.mobs.npcs.queenxeno.desc=This xenomorph appears to be a queen, and is the cause of the excessive breeding on Pixel Spacebase.
actors.mobs.npcs.yogSheep.name=Yog-Dzewa
actors.mobs.npcs.yogSheep.baa!=Baa!
actors.mobs.npcs.yogSheep.baa?=Baa?
actors.mobs.npcs.yogSheep.baa.=Baa.
actors.mobs.npcs.yogSheep.baa...=Baa...
actors.mobs.npcs.yogSheep.desc=Once thought of as a god by the ancients, it turns out that Yog-Dzewa are like space-coral, used by some alien races for decoration.

actors.mobs.npcs.makerbot.name=Maker Bench
actors.mobs.npcs.makerbot.thief=Ha-ha, nice going McGyvr!
actors.mobs.npcs.makerbot.render=Breakdown item into parts:
actors.mobs.npcs.makerbot.desc=This wall-mounted maker bench still has a working matter recycler. It can break unwanted items into usable parts.

actors.mobs.npcs.gunsmith.name=quartermaster
actors.mobs.npcs.gunsmith.intro_commander=Good to see you, Commander. Everyone fled, but I stayed because someone has to keep the armory useful. I need your help with something...
actors.mobs.npcs.gunsmith.intro_shapeshifter=Oh ah, Shapeshift. How... how are you holding up? I could use your help with something.
actors.mobs.npcs.gunsmith.intro_dm3000=Woah, an active DM-3000 unit. I thought your line was shut down. I have a task for you...
actors.mobs.npcs.gunsmith.intro_captain=Captain. Good to see you. I take it you're rounding up a team and taking back the Spacebase? I could use your help with something.
actors.mobs.npcs.gunsmith.intro_1=\n\nWe're low on working arms. I can assemble new blasters, but I need materials first.
actors.mobs.npcs.gunsmith.intro_lazer=If you happen upon a _lazer_ let me know, be careful transporting it though.
actors.mobs.npcs.gunsmith.intro_ember=I'm looking for _plasma embers_ from a newborn elemental discharge. Don't ask me why, just need some.
actors.mobs.npcs.gunsmith.intro_device=Look out for a _bio-charge core_ inside a mature rotberry mine. If you can disable the mine and recover the core, I can make more weapons.
actors.mobs.npcs.gunsmith.intro_2=\n\nIf you can get that for me, I can finish the first blaster quickly. I've got two almost completed, so you can take whichever one you prefer.
actors.mobs.npcs.gunsmith.reminder_lazer=Any luck with the lazer, %s?
actors.mobs.npcs.gunsmith.reminder_ember=Any luck with those plasma embers, %s? You'll need to find four core stabilizers and the restart marker.
actors.mobs.npcs.gunsmith.reminder_device=Any luck with a bio-charge core, %s?
actors.mobs.npcs.gunsmith.def_verb=absorbed
actors.mobs.npcs.gunsmith.desc=This quartermaster stayed behind to keep Pixel Spacebase's armory from becoming scrap.



###mobs
actors.mobs.acidic.name=acid-spitter cannon
actors.mobs.acidic.desc=Acid-spitter cannons are a corrosive skitter-cannon strain grown for containment breaches. Their launcher fires acid-slick spines, and cutting into them risks a splash of caustic blood.

actors.mobs.albino.name=xenomorph
actors.mobs.albino.desc=Xenomorph are cute pets imported by the crew of Pixel Spacebase. Unfortunately they have a violent breeding ritual triggered by the presence of a queen.

actors.mobs.bandit.name=jawar scavenger
actors.mobs.bandit.desc=Jawar scavengers are better-equipped members of the same little salvage crews. They carry stronger tools, move with more confidence, and are even more committed to escaping with anything valuable they can pry loose.

actors.mobs.bat.name=siphon drone
actors.mobs.bat.def_verb=evaded
actors.mobs.bat.desc=Siphon drones were built for emergency field treatment, but their targeting tables have degraded into something predatory. They skim through corridors on quiet rotors, draining biological energy on contact and routing it into their own repair loop.
actors.mobs.drone.name=golden drone
actors.mobs.drone.desc=Despite their small size, golden drones tend to protect their home fiercely. This one is very mad, better keep your distance.

actors.mobs.brute.name=Yendor shock trooper
actors.mobs.brute.enraged=enraged
actors.mobs.brute.enraged_text=The shock trooper overloads its combat rig!
actors.mobs.brute.desc=Yendor shock troopers are heavy raiders wrapped in scavenged station armor and stimulant-fed combat rigs. When badly wounded, the rig overclocks instead of shutting down, making the trooper much more dangerous before the system burns out.

actors.mobs.crab.name=maintenance crawler
actors.mobs.crab.def_verb=parried
actors.mobs.crab.desc=These squat maintenance crawlers were built to scuttle through service ducts and cut through wreckage. Their armored shells make them hard to damage, and their emergency servos make them alarmingly fast.

actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=Unauthorised personnel detected. Core emotion exceeds tactical tolerance.
actors.mobs.dm300.defeated=I was built to protect them. Why did they make me angry?
actors.mobs.dm300.repair=DM-300 repairs itself!
actors.mobs.dm300.rankings_desc=Crushed by the DM-300
actors.mobs.dm300.desc=DM-300 was built as a heavy station defense and construction platform: part loader, part siege machine, part emergency bulkhead closer.\n\nSomeone recovered its core, upgraded the chassis, and installed an emotionally unstable command module. It now treats anything outside its authorization table as a threat, including the people it was supposed to protect.

actors.mobs.elemental.name=plasma anomaly
actors.mobs.elemental.desc=Plasma anomalies leak from damaged containment coils and unstable reactor conduits. Their movement looks almost alive, but every flicker is just heat, pressure, and runaway charge searching for something to burn.

actors.mobs.eye.name=observer horror
actors.mobs.eye.deathgaze_kill=The focused beam killed you...
actors.mobs.eye.desc=Observer horrors drift through Deep Containment like living surveillance drones. Their outer shell is biological, but their central lens burns with impossible precision.\n\nAfter building energy for a short time an observer horror will unleash a devastating focused beam. Anything in its line of sight will take tremendous damage, so break sight before it finishes charging.

actors.mobs.toughxeno.name=evolved xenomorph
actors.mobs.toughxeno.desc=Something is clearly wrong with this xenomorph. Its greasy black fur and rotting skin are very different from the healthy rats you've seen previously. It's pale green eyes make it seem especially menacing.\n\nThe xenomorph carries a cloud of horrible stench with it, it's overpoweringly strong up close.\n\nDark ooze dribbles from the xenomorph's mouth, it eats through the floor but seems to dissolve in water.

actors.mobs.gnoll.name=Yendor scout
actors.mobs.gnoll.desc=The scouts of Yendor are fast raiders from the outer colonies. They are lightly equipped, but they move with the confidence of soldiers who have spent generations fighting in station corridors.
actors.mobs.darklordgnoll.name=dark lord of Yendor
actors.mobs.darklordgnoll.desc=The Yendor are hyena-like humanoids from the outer colonies. This one appears to have trained in the way of the Gith.\n\nThe Dark Lord is armed with toxin flechettes carrying various harmful payloads.

actors.mobs.golem.name=war machine
actors.mobs.golem.def_verb=blocked
actors.mobs.golem.desc=These heavy war machines were built for corridor suppression and hull-breach defense. Their armor still bears old command-sector markings, but their targeting systems have long since stopped caring who owns the station.

actors.mobs.feralshapeshifter.name=feral shapeshifter
actors.mobs.feralshapeshifter.notice=AAARRRGGH!
actors.mobs.feralshapeshifter.defeated=I... I remember myself. Thank you for bringing me back.
actors.mobs.feralshapeshifter.!!!=!!!
actors.mobs.feralshapeshifter.pumpup=The shapeshifter's body starts choosing too many shapes at once...
actors.mobs.feralshapeshifter.enraged=enraged
actors.mobs.feralshapeshifter.enraged_text=The shapeshifter is enraged!
actors.mobs.feralshapeshifter.gluuurp=DIIIEEE!
actors.mobs.feralshapeshifter.rankings_desc=Killed by the feral shapeshifter
actors.mobs.feralshapeshifter.desc=This was one of Pixel Spacebase's shapeshifter crew, used wherever a dangerous repair job needed a body that could fit, seal, or survive the work. Emergency shifts became mandatory after the breach, and each new form stripped away another piece of stable identity.\n\nWhat remains is a colleague trapped in panic, muscle memory, and too many borrowed shapes.

actors.mobs.greatcrab.name=armored crawler
actors.mobs.greatcrab.noticed=The crawler notices the attack and blocks with its massive shield claw.
actors.mobs.greatcrab.blocked=blocked
actors.mobs.greatcrab.desc=This crawler is gigantic, even compared to the station's maintenance units. Its blue armor is covered in weld scars and impact cracks, showing years of service long past its shutdown date. It lumbers around slowly, barely balancing its massive shield claw.\n\nWhile the crawler only has one claw, its size easily compensates. The crawler holds the claw in front of itself whenever it sees a threat, shielding itself behind an almost impenetrable wall of plating.

actors.mobs.guard.name=Bith acolyte
actors.mobs.guard.scorpion=come closer.
actors.mobs.guard.def_verb=blocked
actors.mobs.guard.desc=These fallen security adepts were assigned to the detention block before the breach. They move with ritual discipline now, dragging targets close with a crude force-pull rig mounted under the wrist.\n\nThe old chain gear is gone, but the result is the same: if you give them distance, they will take it away.

actors.mobs.king.name=holodeck monarch
actors.mobs.king.notice=You trespass in my kingdom!
actors.mobs.king.defeated=You cannot end the crown, %s... the simulation... remembers...
actors.mobs.king.def_verb=parried
actors.mobs.king.arise=Court protocol: arise!
actors.mobs.king.rankings_desc=Fell Before the Holodeck Monarch
actors.mobs.king.desc=This rogue monarch is a corrupted command-sector training scenario that has forgotten it was ever fiction. The safety locks failed long ago, leaving the projection hard enough to kill and stubborn enough to keep resurrecting its court.\n\nThe program still believes the deck is its kingdom, and every intruder is a rebel to be executed.
actors.mobs.king$undead.name=hologram retainer
actors.mobs.king$undead.def_verb=blocked
actors.mobs.king$undead.rankings_desc=Fell Before the Holodeck Monarch
actors.mobs.king$undead.desc=These retainers are damaged hard-light projections raised by the monarch's broken court protocol. They flicker between ceremonial armor, skeletal training dummies, and half-loaded crew avatars.
actors.mobs.confusedshapeshifter.name=chest changeling
actors.mobs.confusedshapeshifter.desc=This unstable shapeshifter has forgotten its own body and clung to the outline of a supply chest. It is another echo of the same identity collapse that tore through the station's shapeshifter crew.

actors.mobs.mob.died=You hear something died in the distance.
actors.mobs.mob.name=alien
actors.mobs.mob.desc=A hostile lifeform or station hazard.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.status=This %s is active.
actors.mobs.mob.exp=%+dEXP
actors.mobs.mob.rankings_desc=Slain by: %s
actors.mobs.mob$sleeping.status=This %s is sleeping.
actors.mobs.mob$wandering.status=This %s is wandering.
actors.mobs.mob$hunting.status=This %s is hunting.
actors.mobs.mob$fleeing.status=This %s is fleeing.
actors.mobs.mob$passive.status=This %s is passive.

actors.mobs.monk.name=Jeda knight
actors.mobs.monk.disarm=The Jeda knight knocks the %s from your hands!
actors.mobs.monk.def_verb=parried
actors.mobs.monk.desc=Jeda knights are disciplined command-sector duelists who treat the station breach as a test of devotion. They wear little armor and carry no obvious weapon, relying on speed, pressure-point strikes, and disarming counters.

actors.mobs.newbornelemental.name=plasma spark
actors.mobs.newbornelemental.desc=Plasma sparks are fresh containment leaks that have not yet stabilized into a full anomaly.\n\nThis one is newly formed and weakened as a result. It is especially vulnerable to cold, though its offensive output is still dangerous.
actors.mobs.waterThing.name=coolant phantom
actors.mobs.waterThing.desc=Something nearly invisible is moving through the shallow coolant here. It might be a submerged creature, a pressure distortion, or a maintenance system still trying to drown intruders.

actors.mobs.xenomorph.name=xenomorph
actors.mobs.xenomorph.desc=Xenomorph are cute pets imported by the crew of Pixel Spacebase. Unfortunately they have a violent breeding ritual triggered by the presence of a queen.

actors.mobs.rotheart.name=bio-charge heart
actors.mobs.rotheart.desc=The bio-charge growth has hardened around a live mine core, turning plant tissue into a pulsing containment shell. The swollen central mass protects the organs and charge regulators of the mature hazard.

actors.mobs.rotlasher.name=bio-charge tendril
actors.mobs.rotlasher.desc=Bio-charge tendrils are anchored defensive growths around a mature mine organism. They cannot pursue prey, but anything that comes close is struck by hardened, twitching fiber.\n\nWhen no target is nearby, the tendrils stand motionless and blend into the surrounding contamination.
actors.mobs.rotlasher$waiting.status=This %s is idle.

actors.mobs.scorpio.name=skitter cannon
actors.mobs.scorpio.desc=Skitter cannons are late-stage containment predators with too many legs and a spinal launcher grown along the back. They avoid close combat whenever possible, firing crippling serrated spikes from long distances.

actors.mobs.senior.name=Jeda master
actors.mobs.senior.disarm=The Jeda master tears the %s from your grip!
actors.mobs.senior.def_verb=parried
actors.mobs.senior.desc=Jeda masters are veteran command-sector duelists whose discipline has curdled into fanaticism. Their strikes are faster and more precise than a knight's, and a brief pressure-point lock can leave a target frozen long enough to be finished.

actors.mobs.shaman.name=Yendor shaman
actors.mobs.shaman.zap_kill=The lightning bolt killed you...
actors.mobs.shaman.desc=The most intelligent Yendor can master shamanistic force techniques. Yendor shamans prefer battle spells to compensate for lack of might, not hesitating to use them on those who question their status in a tribe.

actors.mobs.shielded.name=shielded shock trooper
actors.mobs.shielded.def_verb=blocked

actors.mobs.skeleton.name=ruptured crew suit
actors.mobs.skeleton.explo_kill=You were killed by the ruptured suit's shrapnel burst...
actors.mobs.skeleton.def_verb=blocked
actors.mobs.skeleton.desc=These ruined pressure suits still move, driven by corrupted emergency servos and whatever remains inside them. Once damaged enough, the suit frame ruptures in a burst of bone, ceramic plating, and metal fragments.

actors.mobs.spinner.name=facehugger
actors.mobs.spinner.desc=Facehuggers avoid direct combat, preferring to hold back while their target struggles in adhesive biofilament. Once the victim is exposed, the creature closes in and latches on like a living alien egg.
actors.mobs.oldwarbot.name=old war-bot
actors.mobs.oldwarbot.desc=An old war-bot from the Yendor conflicts is still online.\n\nIt appears to have a useful weapon. Be careful.

actors.mobs.succubus.name=signal siren
actors.mobs.succubus.desc=Signal sirens are intrusion organisms that hijack attention through projected voice, pheromone haze, and flickering visual patterns. Once the signal catches, the victim struggles to focus on any target until the effect fades.
actors.mobs.squiddard.name=replicator swarm
actors.mobs.squiddard.def_verb=evaded
actors.mobs.squiddard.desc=A cloud of self-replicating alien microforms held together by a shared impulse to hunt. Destroy one cluster and two weaker copies can split away from the wreckage.

actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_mine=You're mine, %s!
actors.mobs.tengu.notice_face=Face me, %s!
actors.mobs.tengu.interesting=Let's make this interesting...
actors.mobs.tengu.defeated=Free at last... no more locks. No more breath.
actors.mobs.tengu.rankings_desc=Assassinated by the Tengu
actors.mobs.tengu.desc=A famous and enigmatic assassin, named for the mask grafted to his face.\n\nTengu is held down with large clasps on his wrists and knees, though he seems to have gotten rid of his chains long ago.\n\nHe will try to use floor lighting systems, deceptive tech, and precise attacks to eliminate the only thing stopping his escape: you.

actors.mobs.thief.name=jawar
actors.mobs.thief.stole=The jawar stole %s from you!
actors.mobs.thief.carries=\n\nThe jawar is carrying a _%s._ Stolen obviously.
actors.mobs.thief.escapes=The jawar gets away with your %s!
actors.mobs.thief.desc=Jawars are small, jittery scavengers in patched pressure cloaks. They strip parts from anything that slows down, including you.\n\nThey are more likely to steal and run than they are to fight. Keep them in sight, or you might never see your stolen item again.

actors.mobs.warlock.name=signal witch
actors.mobs.warlock.bolt_kill=The shadow pulse killed you...
actors.mobs.warlock.desc=Signal witches were once command-sector specialists who learned to weaponize forbidden station telemetry. Their pulses look like shadow, but the damage is delivered through corrupted implants, bad memories, and raw neural feedback.
actors.mobs.turret.name=mobile turret
actors.mobs.turret.def_verb=evaded
actors.mobs.turret.desc=Defensive turrets, an automated intelligence usually set to defend a terminal or prevent access to unauthorised personnel.

actors.mobs.yog.name=Yog-Dzewa
actors.mobs.yog.notice=The hatch is sealed by hunger...
actors.mobs.yog.defeated=...
actors.mobs.yog.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yog.desc=Yog-Dzewa is the name the station gave to the organism fused around the evacuation spine. It may have arrived as a sample, a stowaway, or something pulled through a breach experiment, but Deep Containment failed before anyone could learn the difference.\n\nNow its mass has grown through the sealed route to the escape pods, feeding on heat, signals, and anything still alive.
actors.mobs.yog$rottingfist.name=necrotic appendage
actors.mobs.yog$rottingfist.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yog$rottingfist.desc=This appendage is old tissue, dead in places and still moving in others. It drags contaminated mass through the deck plating to keep threats away from Yog-Dzewa's core.
actors.mobs.yog$burningfist.name=thermal appendage
actors.mobs.yog$burningfist.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yog$burningfist.desc=This appendage vents stolen reactor heat through living armor. Every motion leaves the air shimmering with pressure, fire, and containment alarms that no longer reach anyone.
actors.mobs.yog$larva.name=parasite larva
actors.mobs.yog$larva.rankings_desc=Devoured by Yog-Dzewa
actors.mobs.yog$larva.desc=These larvae are newly split pieces of Yog-Dzewa's mass, small enough to move through broken deck seams and hungry enough to defend the core without orders.



actors.char.kill=%s killed you...
actors.char.defeat=You defeated the %s.
actors.char.out_of_paralysis=The pain snapped %s out of paralysis.
actors.char.def_verb=dodged
