actors.hero.heroclass.dm3000=DM-3000
actors.hero.heroclass.dm3000_perk1=DM-3000 is fitted with a rocket launcher, which can be retrofitted with a blaster.
actors.hero.heroclass.dm3000_perk2=DM-3000's rocket launcher can be used as a melee weapon or a more powerful blaster.
actors.hero.heroclass.dm3000_perk3=DM-3000 partially identifies blasters after using them.
actors.hero.heroclass.dm3000_perk4=When eaten, any piece of food restores 1 charge for all blasters in the inventory.
