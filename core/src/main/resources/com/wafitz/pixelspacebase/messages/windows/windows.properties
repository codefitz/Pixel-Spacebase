windows.wndstory.operations=The Maintenance decks are a major component of any functioning spacebase.\n\nNormally active with engineers and service droids keeping the station alive, they are now mostly abandoned. The crew have fled or disappeared, and multiple alien races have breached the base.\n\nThere is danger everywhere, but it is not the first time the spacebase has dealt with an invading force.
windows.wndstory.security_block=The Security Block was built to hold the station's most dangerous prisoners, confiscated weapons, and anything command wanted locked behind bulkheads.\n\nWhen the breach began, the detention systems failed one by one. Guards, prisoners, and automated defenses turned on each other while emergency protocols sealed the whole sector.\n\nNobody knows how many were left alive behind these doors, but the block is still locked down around something Security feared more than the riot.
windows.wndstory.lower_engineering=Lower Engineering runs beneath the detention decks: reactor conduits, abandoned excavation tunnels, coolant lines, and old service routes that were never meant for passengers.\n\nMost crew avoided these levels even before the attack. Now the lights flicker, machinery answers to nobody, and outer-colony raiders pick through whatever the engineers left behind.\n\nSomewhere down here, the station's damaged power systems are still trying to keep Pixel Spacebase alive.
windows.wndstory.habitation_command=The Habitation and Command Sector was once the bright center of Pixel Spacebase: crew quarters, civic decks, command offices, and simulation suites built to make deep-space life feel civilized.\n\nAfter the breach, that polish became a trap. Old command systems, rogue holograms, raiders, and half-forgotten defense machines now fight over the same corridors.\n\nWhatever corrupted the station did not stop at the service decks. It reached the places where people were supposed to feel safe.
windows.wndstory.deep_containment=The Bridge sits above the mapped station, past the sectors anyone admits were built. The decks here were sealed around command systems, alien growths, and breach hardware that command could not safely remove.\n\nNow the seals are failing. Heatless lava, hostile organisms, and impossible signals leak through the bridge grid.\n\nVery few have ever climbed this high and returned with a sane report.
