windows.gunsmith.dust=Good, you found the containment dust. Don't worry about any residual signatures, I can isolate them. As promised, choose one of my high quality blasters.
windows.gunsmith.ember=Good, you recovered the faulty core module. I can isolate the corrupted matrix and put the usable components to work. As promised, choose one of my high quality blasters.
windows.gunsmith.berry=Good, you recovered the bio-charge core. I hope shutting that hazard down didn't trouble you too much. As promised, choose one of my high quality blasters.
windows.gunsmith.farewell=Good hunting, %s!
