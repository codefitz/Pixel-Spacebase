scenes.amuletscene.text=You finally hold the escape pod override in your hands. The evacuation cradle can release the last working pod and end this nightmare now.\n\nBut the override is not just a launch key. It can reopen %d sealed rescue cradles from life-sign terminals across the station, giving anyone still alive a route out.\n\nYou can leave now, or carry the override back into Pixel Spacebase while the station still tears itself apart.

