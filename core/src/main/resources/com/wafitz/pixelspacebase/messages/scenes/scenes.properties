scenes.introscene.text=You awake to the sound of alarms blaring. You recognise the alarm pattern indicating an imminent attack.\n\nFortunately, your quarters are right next to the escape pods! Whew, this is going to be short game!\n\nStill, there might be time to find a spacesuit and gather some equipment before leaving...

