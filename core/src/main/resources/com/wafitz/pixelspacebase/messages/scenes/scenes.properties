scenes.welcomescene.welcome_msg=Pixel Spacebase is a roguelike RPG, with randomly generated enemies, levels, items, and secrets!\n\nEach run is a new challenging experience, but be careful, death is permanent!\n\nHave fun and try not to get eaten!
