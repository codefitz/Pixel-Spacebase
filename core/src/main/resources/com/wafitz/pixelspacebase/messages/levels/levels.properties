levels.features.sign.dead_end=What are you doing here?!
levels.features.sign.tip_1=_Level 1: Maintenance_\n\nEmployee Notices:\n\nKeeping Xenomorphs as pets is now banned due to breeding by careless owners.\n\nDo not pet the cat.\n\nA number of damaged deck panels have been exposed by recent attacks. Some are hiding salvage; some are still live. Be careful when crossing floors!
levels.features.sign.tip_2=_Level 2: Maintenance_\n\nEmployee Notices:\n\nA number of floors have flooded due to a faulty Sabatier unit. Watch your step around electricals.\n\nShapeshifters: don't forget to check in regularly with your assigned therapist!
levels.features.sign.tip_3=_Level 3: Maintenance_\n\nEmployee Notices:\n\nShapeshifters: don't forget to check in regularly with your assigned therapist!
levels.features.sign.tip_4=_Level 4: Maintenance_\n\nEmployee Notices:\n\nShapeshifter psych check-ins are now mandatory. If a crew member loses coherent form, retreat, seal the nearest bulkhead, and notify Security before proceeding to level 5.
levels.features.sign.tip_5=_Level 5: Maintenance_\n\nEmployee Notices:\n\nThis level is closed due to an unidentified hazard. Do not proceed past this notice!

levels.features.sign.tip_6=_Level 6: Security Block_\n\nLockdown Notice:\n\nDetention bulkheads are sealed under emergency authority. Confiscated weapons and prisoner property remain in evidence lockers until command clearance is restored.\n\nDo not open cells without a live security escort.
levels.features.sign.tip_7=_Level 7: Security Block_\n\nContraband Bulletin:\n\nSeveral storage cages were breached during the evacuation. If you recover unknown plasmids, upgrades, or blasters, identify them before field use.\n\nSecurity is not responsible for injury caused by unlabelled evidence.
levels.features.sign.tip_8=_Level 8: Security Block_\n\nRation Advisory:\n\nThe detention kitchens are offline. Hunger will not injure you immediately, but starvation will compromise judgment, motor control, and survival odds.\n\nEat before the warning becomes a crisis.
levels.features.sign.tip_9=_Level 9: Security Block_\n\nTactical Advisory:\n\nSome prisoners and defense systems are most dangerous at range. Break line of sight, use doors, and make threats come to you instead of crossing open corridors under fire.
levels.features.sign.tip_10=Thomas,\n\nYou've been a great friend, so I'm going to do you a favour. When you get to your shift tonight, check the masked prisoner's cell, then get out.\n\nDoesn't matter if the prisoners try and escape, pretty soon nobody will be able to leave this place.\n\nThat freak has to stay secured though, if he escapes there's no telling what he'll do. Just make sure his cell is locked, then get out.\n\nDon't bother looking for me after this. A captain must go down with his ship.\n- Security Chief Smith
levels.features.sign.tip_11=_Level 11: Lower Engineering_\n\nShift Notice:\n\nReactor conduits, coolant channels, and excavation access are unstable below this point. Do not trust clear corridors; machinery and raiders both use service tunnels to flank intruders.
levels.features.sign.tip_12=_Level 12: Lower Engineering_\n\nSafety Advisory:\n\nIf several hostiles engage at once, retreat behind a door or bulkhead and make them enter one at a time. Open engineering floors are killing zones.
levels.features.sign.tip_13=_Level 13: Lower Engineering_\n\nFire Protocol:\n\nIf you are burning, water can suppress the flames only while you are actually grounded. Levitating over coolant is not the same as being in it.
levels.features.sign.tip_14=_Level 14: Lower Engineering_\n\nClone Warning:\n\nUnblessed backup clones remain unstable. Keeping more than one active copy risks total clone collapse during resurrection.
levels.features.sign.tip_15=_Level 15: Reactor Works_\n\nDANGER:\n\nHeavy machinery can cause injury, loss of limbs, or death. Rogue defense platforms are not authorized to distinguish staff from intruders.
levels.features.sign.tip_16=_Level 16: Habitation Ring_\n\nCivic Notice:\n\nCrew quarters, public lounges, and command offices are operating under emergency blackout. Stay clear of open plazas where raiders and defense machines can maintain firing lanes.
levels.features.sign.tip_17=_Level 17: Command Sector_\n\nArmory Advisory:\n\nUpgrading enhanced weapons can destabilize their special effect. Command technicians recommend backing up your loadout before applying field modifications.
levels.features.sign.tip_18=_Level 18: Simulation Annex_\n\nFabrication Notice:\n\nAtomic Diffusion Terminals can produce prototypes and legacy items no longer found in station inventory. Report unauthorized simulations to Holodeck Control.
levels.features.sign.tip_19=_Level 19: Holodeck Approach_\n\nEnhancement Advisory:\n\nStable weapon enhancements require infusion tech. Improvised upgrades may work, but command will not certify them for use inside active hard-light scenarios.
levels.features.sign.tip_20=_Level 20: Holodeck Control_\n\nSimulation Warning:\n\nThe monarch scenario is still active and all safety interlocks have failed. Hard-light retainers may be treated as live combatants.\n\nDo not enter the court unless you are prepared to end the program by force.
levels.features.sign.tip_21=_Level 21: Final Workshop_\n\nWorkshop Notice:\n\nThis is the last stable fabrication bay before Deep Containment. Repair what you can, recycle what you cannot carry, and do not open sealed containment routes without an exit plan.
levels.features.sign.burn=As you try to read the terminal it bursts into greenish flames.
