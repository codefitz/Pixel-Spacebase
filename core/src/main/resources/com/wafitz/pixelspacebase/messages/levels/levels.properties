###vents
levels.vents.vent.name=Floor lighting
levels.vents.vent.desc=A concealed station floor system. It may trigger when something steps on it.
levels.vents.alarmvent.name=Alarm floor lighting
levels.vents.alarmvent.alarm=The floor lighting emits a piercing sound that echoes throughout the spacebase!
levels.vents.alarmvent.desc=This floor lighting seems to be tied to a loud alarm mechanism. Triggering it will likely alert everything on the level.
levels.vents.blazingvent.name=Blazing floor lighting
levels.vents.blazingvent.desc=Stepping on this floor lighting will ignite a powerful chemical mixture, setting a wide area ablaze.
levels.vents.chillingvent.name=Chilling floor lighting
levels.vents.chillingvent.ondeath=You succumb to the chilling floor lighting...
levels.vents.chillingvent.desc=When activated, chemicals in this floor lighting will create a snap-frost at its location.
levels.vents.confusionvent.name=Confusion floor lighting
levels.vents.confusionvent.desc=Triggering this floor lighting will set a cloud of confusion gas loose within the immediate area.
levels.vents.cursingvent.name=Malfunctioning floor lighting
levels.vents.cursingvent.malfunction=Your worn equipment becomes malfunctioning!
levels.vents.cursingvent.desc=This floor lighting contains the same corrupt signal found in malfunctioning equipment. Triggering it will malfunction some items in the immediate area.
levels.vents.malfunctioningvent.malfunction=Your worn equipment becomes malfunctioning!
levels.vents.disarmingvent.name=Disarming floor lighting
levels.vents.disarmingvent.disarm=Your weapon is teleported away!
levels.vents.disarmingvent.desc=This floor lighting contains very specific teleportation tech, which will warp the weapon of its victim to some other location.
levels.vents.disintegrationvent.name=Disintegration floor lighting
levels.vents.disintegrationvent.one=The floor lighting disintegrates your %s!
levels.vents.disintegrationvent.some=The floor lighting disintegrates some of your %s!
levels.vents.disintegrationvent.ondeath=You were killed by the disintegration floor lighting...
levels.vents.disintegrationvent.desc=When triggered, this floor lighting will lance the target with beams of disintegration, dealing significant damage and destroying items.
levels.vents.distortionvent.name=Distortion floor lighting
levels.vents.distortionvent.desc=Built from strange tech of unknown origin, this floor lighting will shift and morph the world around you.
levels.vents.explosivevent.name=Explosive floor lighting
levels.vents.explosivevent.desc=This floor lighting contains an explosive charge and trigger mechanism. Activating it will cause an explosion in the immediate area.
levels.vents.firevent.name=Fire floor lighting
levels.vents.firevent.desc=Stepping on this floor lighting will ignite a chemical mixture, setting the immediate area aflame.
levels.vents.flashingvent.name=Flashing floor lighting
levels.vents.flashingvent.desc=On activation, this floor lighting will ignite a potent flashing charge, temporarily blinding and crippling its victim.
levels.vents.flockvent.name=Flock floor lighting
levels.vents.flockvent.desc=Perhaps a joke from some amateur robot, triggering this floor lighting will create a flock of holographic Yog-Dzewa echoes.
levels.vents.frostvent.name=Frost floor lighting
levels.vents.frostvent.ondeath=You succumb to the freezing floor lighting...
levels.vents.frostvent.desc=When activated, chemicals in this floor lighting will create a powerful snap-frost at its location.
levels.vents.grimvent.name=Grim floor lighting
levels.vents.grimvent.ondeath=You were killed by the blast of grim floor lighting...
levels.vents.grimvent.desc=Extremely powerful destructive energy is stored within this floor lighting, enough to instantly kill all but the healthiest heroes. Triggering it will send a ranged blast toward the nearest character.
levels.vents.grippingvent.name=Gripping floor lighting
levels.vents.grippingvent.desc=Triggering this floor lighting will send barbed restraints along the ground, damaging the victim's feet and rooting them in place.
levels.vents.guardianvent.name=Guardian floor lighting
levels.vents.guardianvent.alarm=The floor lighting emits a piercing sound that echoes throughout the spacebase!
levels.vents.guardianvent.desc=This floor lighting is tied to a strange summoning mechanism, which will summon guardians and alert all enemies on the floor.
levels.vents.guardianvent$guardian.name=summoned guardian
levels.vents.guardianvent$guardian.desc=This blue apparition seems to be a summoned echo of one of the spacebase's old hard-light guardians.\n\nWhile the guardian itself is almost incorporeal, the _%s,_ it's wielding, looks real.
levels.vents.lightningvent.name=Charged floor lighting
levels.vents.lightningvent.ondeath=You were killed by a discharge of charged floor lighting...
levels.vents.lightningvent.desc=A floor mechanism with a large amount of energy stored into it. Triggering the lighting will discharge that energy into whatever activates it.
levels.vents.oozevent.name=Ooze floor lighting
levels.vents.oozevent.desc=This floor lighting will splash out caustic ooze when activated, which will burn until it is washed away.
levels.vents.paralyticvent.name=Paralytic floor lighting
levels.vents.paralyticvent.desc=Triggering this floor lighting will set a cloud of paralytic gas loose within the surrounding area.
levels.vents.pitfallvent.name=Pitfall floor lighting
levels.vents.pitfallvent.desc=This pressure plate rests atop a fairly weak floor, and will likely collapse into a pit if it is pressed.
levels.vents.poisonvent.name=Poison floor lighting
levels.vents.poisonvent.desc=A hidden flechette launcher must be buried nearby. Activating this floor lighting will cause it to fire a poisoned micro-spike at you.
levels.vents.rockfallvent.name=Rockfall floor lighting
levels.vents.rockfallvent.ondeath=You were crushed by the rockfall floor lighting...
levels.vents.rockfallvent.desc=This floor lighting is connected to a series of loose rocks above; triggering it will cause them to come crashing down.
levels.vents.spearvent.name=Spear floor lighting
levels.vents.spearvent.ondeath=You were skewered by the spear floor lighting...
levels.vents.spearvent.desc=The classic spear trap hidden under floor lighting: primitive but effective. Due to its simple nature, it can activate many times without breaking.
levels.vents.summoningvent.name=Summoning floor lighting
levels.vents.summoningvent.desc=Triggering this floor lighting will summon a number of this area's monsters to this location.
levels.vents.teleportationvent.name=Teleportation floor lighting
levels.vents.teleportationvent.desc=Whatever triggers this floor lighting will be warped to some other location on this floor.
levels.vents.toxicvent.name=Toxic floor lighting
levels.vents.toxicvent.desc=Triggering this floor lighting will set a cloud of toxic gas loose within the surrounding area.
levels.vents.vent.rankings_desc=Killed by: %s
levels.vents.venomvent.name=Venom floor lighting
levels.vents.venomvent.desc=Triggering this floor lighting will set a cloud of deadly venom gas loose within the immediate area.
levels.vents.warpingvent.name=Warping floor lighting
levels.vents.warpingvent.desc=Whatever triggers this floor lighting will be warped to some other location in the spacebase.
levels.vents.weakeningvent.name=Weakening floor lighting
levels.vents.weakeningvent.desc=A corrupt energy field in this floor lighting sucks the energy out of anything that comes into contact with it.
levels.vents.wornvent.name=Worn out floor lighting
levels.vents.wornvent.nothing=Nothing happens...
levels.vents.wornvent.desc=Due to age and possibly poor workmanship, this floor lighting has worn to the point where it won't do anything when triggered.



