levels.securityblocklevel.water_desc=This runoff has leaked from detention washdown systems. It smells metallic, but it will still extinguish fire.
levels.securityblocklevel.empty_deco_desc=Old blood and scuffed drag marks stain the detention floor.
levels.securityblocklevel.bookshelf_desc=These are security binders, intake records, and confiscation logs. The paper would still burn.

