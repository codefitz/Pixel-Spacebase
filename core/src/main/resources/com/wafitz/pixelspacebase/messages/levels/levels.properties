levels.operationslevel.bookshelf_desc=The shelf holds technical binders and outdated maintenance logs.
levels.sewerlevel.water_name=Coolant spill
levels.sewerlevel.water_desc=This legacy maintenance spill can still extinguish fire.
levels.sewerlevel.empty_deco_desc=Wet yellow warning residue covers the floor.
levels.sewerlevel.bookshelf_desc=The shelf is packed with damaged manuals and cheap emergency pamphlets. It might burn.
