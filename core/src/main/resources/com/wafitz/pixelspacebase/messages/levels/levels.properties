###painters
levels.painters.massgravepainter$holodeckhalls.name=Holodeck program
levels.painters.massgravepainter$holodeckhalls.desc=The room's emitters project an old fortress corridor: scorched stone, heavy walls, and just enough hard-light solidity to make the simulation dangerous.

levels.painters.ritualsitepainter$ritualmarker.name=Core restart marker
levels.painters.ritualsitepainter$ritualmarker.desc=A scorched floor marker for an emergency core restart pattern. Stabilizers are usually placed on the four corners.

levels.painters.weakfloorpainter$hiddenwell.name=Distant well
levels.painters.weakfloorpainter$hiddenwell.desc=You can just make out a well in the depths below, perhaps there is something down there?
levels.prisonbosslevel$alienplanetsurface.name=Alien planet surface
levels.prisonbosslevel$alienplanetsurface.desc=The holodeck floor projects an alien desert surface: hot, cracked, and too vivid to feel entirely fake.
###vents
levels.vents.vent.name=Exposed panel
levels.vents.vent.desc=A concealed station floor system. It may trigger when something steps on it.
levels.vents.alarmvent.name=Alarm exposed panel
levels.vents.alarmvent.alarm=The exposed panel emits a piercing sound that echoes throughout the spacebase!
levels.vents.alarmvent.desc=This exposed panel seems to be tied to a loud alarm mechanism. Triggering it will likely alert everything on the level.
levels.vents.blazingvent.name=Blazing exposed panel
levels.vents.blazingvent.desc=Stepping on this exposed panel will ignite a powerful chemical mixture, setting a wide area ablaze.
levels.vents.chillingvent.name=Chilling exposed panel
levels.vents.chillingvent.ondeath=You succumb to the chilling exposed panel...
levels.vents.chillingvent.desc=When activated, chemicals in this exposed panel will create a snap-frost at its location.
levels.vents.confusionvent.name=Confusion exposed panel
levels.vents.confusionvent.desc=Triggering this exposed panel will set a cloud of confusion gas loose within the immediate area.
levels.vents.cursingvent.name=Malfunctioning exposed panel
levels.vents.cursingvent.malfunction=Your worn equipment becomes malfunctioning!
levels.vents.cursingvent.desc=This exposed panel contains the same corrupt signal found in malfunctioning equipment. Triggering it will malfunction some items in the immediate area.
levels.vents.malfunctioningvent.malfunction=Your worn equipment becomes malfunctioning!
levels.vents.disarmingvent.name=Disarming exposed panel
levels.vents.disarmingvent.disarm=Your weapon is teleported away!
levels.vents.disarmingvent.desc=This exposed panel contains very specific teleportation tech, which will warp the weapon of its victim to some other location.
levels.vents.disintegrationvent.name=Disintegration exposed panel
levels.vents.disintegrationvent.one=The exposed panel disintegrates your %s!
levels.vents.disintegrationvent.some=The exposed panel disintegrates some of your %s!
levels.vents.disintegrationvent.ondeath=You were killed by the disintegration exposed panel...
levels.vents.disintegrationvent.desc=When triggered, this exposed panel will lance the target with beams of disintegration, dealing significant damage and destroying items.
levels.vents.distortionvent.name=Distortion exposed panel
levels.vents.distortionvent.desc=Built from strange tech of unknown origin, this exposed panel will shift and morph the world around you.
levels.vents.explosivevent.name=Explosive exposed panel
levels.vents.explosivevent.desc=This exposed panel contains an explosive charge and trigger mechanism. Activating it will cause an explosion in the immediate area.
levels.vents.firevent.name=Fire exposed panel
levels.vents.firevent.desc=Stepping on this exposed panel will ignite a chemical mixture, setting the immediate area aflame.
levels.vents.flashingvent.name=Flashing exposed panel
levels.vents.flashingvent.desc=On activation, this exposed panel will ignite a potent flashing charge, temporarily blinding and crippling its victim.
levels.vents.flockvent.name=Flock exposed panel
levels.vents.flockvent.desc=Perhaps a joke from some amateur robot, triggering this exposed panel will create a flock of holographic containment echoes.
levels.vents.frostvent.name=Frost exposed panel
levels.vents.frostvent.ondeath=You succumb to the freezing exposed panel...
levels.vents.frostvent.desc=When activated, chemicals in this exposed panel will create a powerful snap-frost at its location.
levels.vents.grimvent.name=Execution exposed panel
levels.vents.grimvent.ondeath=You were killed by the blast of an execution exposed panel...
levels.vents.grimvent.desc=Extremely powerful destructive energy is stored within this exposed panel, enough to instantly kill all but the healthiest heroes. Triggering it will send a ranged blast toward the nearest character.
levels.vents.grippingvent.name=Gripping exposed panel
levels.vents.grippingvent.desc=Triggering this exposed panel releases a deck-level grip field, wrenching the victim off balance, damaging their feet, and rooting them in place.
levels.vents.guardianvent.name=Guardian exposed panel
levels.vents.guardianvent.alarm=The exposed panel emits a piercing sound that echoes throughout the spacebase!
levels.vents.guardianvent.desc=This exposed panel is tied to a strange summoning mechanism, which will summon guardians and alert all enemies on the floor.
levels.vents.guardianvent$guardian.name=summoned guardian
levels.vents.guardianvent$guardian.desc=This blue apparition seems to be a summoned echo of one of the spacebase's old hard-light guardians.\n\nWhile the guardian itself is almost incorporeal, the _%s,_ it's wielding, looks real.
levels.vents.lightningvent.name=Charged exposed panel
levels.vents.lightningvent.ondeath=You were killed by a discharge of charged exposed panel...
levels.vents.lightningvent.desc=A floor mechanism with a large amount of energy stored inside it. Triggering the exposed panel will discharge that energy into whatever activates it.
levels.vents.oozevent.name=Ooze exposed panel
levels.vents.oozevent.desc=This exposed panel will splash out caustic ooze when activated, which will burn until it is washed away.
levels.vents.paralyticvent.name=Paralytic exposed panel
levels.vents.paralyticvent.desc=Triggering this exposed panel will set a cloud of paralytic gas loose within the surrounding area.
levels.vents.pitfallvent.name=Pitfall exposed panel
levels.vents.pitfallvent.desc=This pressure plate rests atop a fairly weak floor, and will likely collapse into a pit if it is pressed.
levels.vents.poisonvent.name=Poison exposed panel
levels.vents.poisonvent.desc=A hidden flechette launcher must be buried nearby. Activating this exposed panel will cause it to fire a poisoned micro-spike at you.
levels.vents.rockfallvent.name=Rockfall exposed panel
levels.vents.rockfallvent.ondeath=You were crushed by the rockfall exposed panel...
levels.vents.rockfallvent.desc=This exposed panel is connected to a series of loose rocks above; triggering it will cause them to come crashing down.
levels.vents.spearvent.name=Spear exposed panel
levels.vents.spearvent.ondeath=You were skewered by the spear exposed panel...
levels.vents.spearvent.desc=The classic spear trap hidden under exposed panel: primitive but effective. Due to its simple nature, it can activate many times without breaking.
levels.vents.summoningvent.name=Summoning exposed panel
levels.vents.summoningvent.desc=Triggering this exposed panel will summon a number of this area's monsters to this location.
levels.vents.teleportationvent.name=Teleportation exposed panel
levels.vents.teleportationvent.desc=Whatever triggers this exposed panel will be warped to some other location on this floor.
levels.vents.toxicvent.name=Toxic exposed panel
levels.vents.toxicvent.desc=Triggering this exposed panel will set a cloud of toxic gas loose within the surrounding area.
levels.vents.vent.rankings_desc=Killed by: %s
levels.vents.venomvent.name=Venom exposed panel
levels.vents.venomvent.desc=Triggering this exposed panel will set a cloud of deadly venom gas loose within the immediate area.
levels.vents.warpingvent.name=Warping exposed panel
levels.vents.warpingvent.desc=Whatever triggers this exposed panel will be warped to some other location in the spacebase.
levels.vents.weakeningvent.name=Weakening exposed panel
levels.vents.weakeningvent.desc=A corrupt energy field in this exposed panel sucks the energy out of anything that comes into contact with it.
levels.vents.wornvent.name=Worn out exposed panel
levels.vents.wornvent.nothing=Nothing happens...
levels.vents.wornvent.desc=Due to age and possibly poor workmanship, this exposed panel has worn to the point where it won't do anything when triggered.



