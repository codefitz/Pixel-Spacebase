apply plugin: 'com.android.library'

android {
    compileSdkVersion 34
    namespace "com.watabou"

    task ndkBuild(type: Exec){
        description "builds JNI libs from source. " +
                "This requires the Android NDK and is optional as precompiled libs are provided."

        def root = project(':pd-classes').projectDir
        doFirst {
            def ndkDir = null

            if (android.hasProperty('ndkDirectory') && android.ndkDirectory != null) {
                def ndkDirectory = android.ndkDirectory
                if (ndkDirectory instanceof File) {
                    ndkDir = ndkDirectory.absolutePath
                } else if (ndkDirectory.hasProperty('asFile')) {
                    ndkDir = ndkDirectory.asFile.absolutePath
                } else if (ndkDirectory.metaClass.respondsTo(ndkDirectory, 'get')) {
                    def providedDirectory = ndkDirectory.get()
                    if (providedDirectory instanceof File) {
                        ndkDir = providedDirectory.absolutePath
                    } else if (providedDirectory != null && providedDirectory.hasProperty('asFile')) {
                        ndkDir = providedDirectory.asFile.absolutePath
                    }
                }
            }

            if (ndkDir == null) {
                def localProperties = project.rootProject.file('local.properties')
                if (localProperties.exists()) {
                    Properties properties = new Properties()
                    properties.load(localProperties.newDataInputStream())
                    ndkDir = properties.getProperty('ndk.dir')
                }
            }

            if (ndkDir == null) {
                ndkDir = System.getenv("ANDROID_NDK_ROOT") ?: System.getenv("ANDROID_NDK_HOME")
            }

            if (ndkDir == null) {
                throw new GradleException(
                        "Android NDK not found. Configure android.ndkDirectory, " +
                                "set ndk.dir in local.properties, or set " +
                                "ANDROID_NDK_ROOT or ANDROID_NDK_HOME before running :pd-classes:ndkBuild."
                )
            }

            //Need to execute through cmd on windows systems
            if (System.properties["os.name"].toLowerCase().contains("windows")){
                executable "cmd"
                args "/c", "$ndkDir${File.separator}ndk-build",
                        "NDK_PROJECT_PATH=$root/src/main/jniSources",
                        "NDK_APPLICATION_MK=$root/src/main/jniSources/Application.mk",
                        "APP_BUILD_SCRIPT=$root/src/main/jniSources/Android.mk",
                        "NDK_LIBS_OUT=$root/src/main/jniLibs"

            } else {
                executable "$ndkDir/ndk-build"
                args "NDK_PROJECT_PATH=$root/src/main/jniSources",
                        "NDK_APPLICATION_MK=$root/src/main/jniSources/Application.mk",
                        "APP_BUILD_SCRIPT=$root/src/main/jniSources/Android.mk",
                        "NDK_LIBS_OUT=$root/src/main/jniLibs"

            }
        }
    }
    defaultConfig {
        minSdkVersion 8
    }
}
